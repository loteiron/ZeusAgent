name: ZeusAgent upstream integration

on:
  push:
    branches: [zeus-engineering]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows_commands:
    name: Windows · native npm command and installer contracts
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Exercise the actual Windows launchers
        run: node --test scripts/windows-runtime.test.mjs scripts/stage_zeus_npm.test.mjs

  regressions:
    name: Ubuntu · upstream and Zeus regression contracts
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
        with:
          version: '0.11.33'
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Install isolated test dependencies
        run: |
          sudo apt-get update && sudo apt-get install --yes ripgrep
          uv sync --locked --python 3.12 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra hindsight --extra parallel-web --extra messaging --extra wecom
      - name: Run the changed tests and Zeus contracts without retries
        shell: bash
        run: |
          set -euo pipefail
          base=$(python3 -c 'import json; print(json.load(open("upstream-sync.json"))["zeus_base"])')
          [[ "$base" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$base^{commit}"
          mapfile -t tests < <(git diff --name-only --diff-filter=ACM "$base" HEAD -- tests | awk '/(^|\/)test_[^/]+\.py$/')
          test "${#tests[@]}" -gt 0
          bash scripts/run_tests.sh -j 4 --file-timeout 300 --file-retries 0 "${tests[@]}" \
            tests/gateway/test_telegram_command_integrity.py tests/gateway/test_telegram_session_controls.py \
            tests/zeus_cli/test_hermes_import.py tests/tui_gateway/test_hermes_migration.py \
            tests/zeus_cli/test_goal_workspace_evidence.py tests/zeus_cli/test_goal_control_races.py \
            tests/agent/test_workspace_identity.py tests/agent/test_verification_revision.py \
            tests/zeus_cli/test_process_ledger_persistence.py \
            tests/zeus_state/test_shared_session_db_registry.py \
            tests/tui_gateway/test_compute_host.py tests/tui_gateway/test_compute_host_phase1.py \
            tests/tui_gateway/test_compute_host_turn_protocol.py \
            tests/tui_gateway/test_auto_continue.py tests/tui_gateway/test_session_control.py \
            tests/tools/test_skills_tool.py tests/tools/test_subagent_sudo_prompt.py \
            tests/scripts/test_windows_footguns_full_repo_scan.py -- --tb=short -ra | tee integration-tests.log
      - name: Exercise the actual Linux runtime and npm launchers
        run: node --test scripts/linux-runtime.test.mjs scripts/stage_zeus_npm.test.mjs
      - name: Retain the actual test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: upstream-integration-results
          path: integration-tests.log
          retention-days: 14
